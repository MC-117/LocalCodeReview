<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>代码审查 · Codex</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js" defer></script><script src="/bridge.js" defer></script><script src="/viewer.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header><div class="heading"><strong>代码审查</strong><span id="projectName">当前项目</span></div><span id="progressText" class="progress-text"></span><span id="saveState" class="subtle" role="status" aria-live="polite">默认通过 · 提交时记录</span><div class="header-actions"><select id="languageSelect" aria-label="界面语言" title="界面语言"><option value="auto">自动（跟随系统）</option><option value="en">English</option><option value="zh-CN">简体中文</option></select><button id="expandReview" hidden>展开</button><button id="toggleCode">浏览修改</button><button id="refresh">刷新</button><details id="moreMenu" class="more-menu"><summary aria-label="更多操作" title="更多操作">⋯</summary><div class="more-actions" role="group" aria-label="更多操作"><button id="export">导出审查记录…</button><button id="retrySave" hidden>重试自动保存</button></div></details><button id="sendFeedback" class="primary" hidden>提交意见给助手</button></div></header>
<div class="scope-bar"><span id="scopeLabel">正在读取会话修改…</span><span id="scopeEndpoints" class="scope-reason" hidden></span><span id="scopeReason" class="scope-reason"></span><button id="settingsToggle" aria-expanded="false">范围与选项 ⌄</button></div>
<section id="settings" hidden>
<div class="settings-row"><label>来源<select id="source"><option value="round">单轮修改（固定前后）</option><option value="session">会话补丁</option><option value="snapshot">快照 → 当前</option><option value="git">HEAD → 当前（补充）</option></select></label><label id="roundField" class="grow" hidden>修改轮次<select id="round"></select></label><label id="sessionField" class="grow">会话<select id="session"></select></label><label id="snapshotField" class="grow" hidden>基线<select id="snapshot"></select></label><label class="turn-field">起始轮次<input id="start" type="number" min="1" placeholder="全部"></label><label class="turn-field">结束轮次<input id="end" type="number" min="1" placeholder="全部"></label><button id="snapshotButton">记录当前快照</button></div>
<div class="settings-row"><input id="include" aria-label="包含路径" placeholder="包含目录 / 通配符，逗号分隔"><input id="exclude" aria-label="排除路径" placeholder="排除目录 / 通配符"><label class="inline"><input id="defaults" type="checkbox" checked>隐藏资源、第三方与构建产物</label><button id="applyScope">应用范围</button></div>
<p class="help">会话记录直接来自本地日志，可能包含后来回退的操作，不等于当前净差异。无成功回执的补丁单独标识。单轮修改使用助手预先记录的轮前、轮后快照，后续修改不混入；缺少端点时无法事后还原。</p><div class="settings-row secondary"><button id="useSuggestedScope" hidden>恢复助手范围</button><button id="sourceHelp">查看轮次与覆盖说明</button><button id="discardDrafts">重新读取已保存记录（放弃草稿）</button></div></section>
<div id="notice" role="status" hidden></div>
<div id="workflowStatus" class="workflow-status" role="status">保存审查意见后，助手先给出修改方案，等你确认后再修改。</div>
<details id="planPanel" class="plan-panel" hidden><summary>查看助手提出的修改方案</summary><pre id="planText"></pre></details>
<main><aside><div class="navigation-modes" role="group" aria-label="浏览分组"><button data-nav="feature" aria-pressed="true">功能</button><button data-nav="directory" aria-pressed="false">目录</button><button data-nav="file" aria-pressed="false">文件</button></div><div class="list-title"><span>修改导览</span><small id="counts"></small></div><div id="itemList" class="item-list"></div><div class="opinion"><div class="opinion-heading"><label id="opinionLabel" for="notes">意见</label><span id="noteMeta" class="subtle"></span></div><select id="commentTarget" aria-label="批注对象"></select><textarea id="notes" rows="5" placeholder="只需批注有问题的地方；也可以针对整个类或功能提出意见。"></textarea><p class="hint">点行号可批注代码；Shift+点击可选择范围。点类名或函数名可批注符号。</p><div id="noteList" class="note-list" aria-label="已保存意见"></div></div></aside>
<section class="code-area"><div class="file-toolbar"><input id="fileSearch" aria-label="搜索当前项文件" placeholder="查找文件…"><span id="fileCount" class="subtle"></span><div class="view-toggle" aria-label="代码布局"><button id="patchView" class="active" aria-pressed="true">单页</button><button id="splitView" aria-pressed="false">并排</button><button id="currentView" aria-pressed="false">当前文件</button></div></div><details id="guideSummary" class="guide-summary"><summary id="guideTitle">修改目的与验证</summary><div id="guideBody"></div></details><nav id="files" aria-label="当前项文件"></nav><div class="code-title"><span id="filePath"></span><div class="code-actions"><button id="jumpDiff" title="定位当前审查范围的修改处" disabled>跳转 diff</button><button id="copyLocation" title="复制当前文件路径">复制路径</button></div></div><div class="change-toolbar"><button id="prevChange" title="上一处修改（Alt+↑）" aria-label="上一处修改">↑ 上一处</button><button id="nextChange" title="下一处修改（Alt+↓）" aria-label="下一处修改">↓ 下一处</button><span id="changeCount" class="subtle">0 处修改</span><select id="changeSelect" aria-label="定位修改"><option>没有修改位置</option></select></div><div id="code" class="code"><div class="empty">正在读取修改…</div></div></section></main>
<footer><span id="footerText">仅本机 · 代码只读</span><span id="lastCheck"></span></footer><div id="toast" role="alert" hidden></div>
<dialog id="dialog"><div class="dialog-title"><strong id="dialogTitle">审查意见</strong><button id="closeDialog" aria-label="关闭">✕</button></div><textarea id="dialogText" readonly></textarea><div class="dialog-actions"><button id="copyText">复制</button><button id="downloadText">下载 Markdown</button></div></dialog>
<dialog id="snapshotDialog" class="small-dialog"><strong>记录当前快照</strong><p class="help">仅保存文本基线，不修改项目代码。</p><label for="snapshotName">名称</label><input id="snapshotName" value="修改前基线" maxlength="120"><div class="dialog-actions"><button id="cancelSnapshot">取消</button><button id="captureSnapshot" class="primary">记录</button></div></dialog>
</body></html>
